[meta]
name = "Matugen"
description = "Follows the wallpaper palette"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "{{colors.primary.default.hex}}"
accent_foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
secondary_background = "{{colors.surface_container.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"

[colors.main_window]
border = "colors.core.border"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "colors.core.border"

[colors.accents]
blue = "{{colors.primary.default.hex}}"
green = "{{colors.secondary.default.hex}}"
magenta = "{{colors.tertiary.default.hex}}"
orange = "{{colors.inverse_primary.default.hex}}"
red = "{{colors.error.default.hex}}"
yellow = "{{colors.tertiary_fixed.default.hex}}"
cyan = "{{colors.secondary_fixed.default.hex}}"
purple = "{{colors.primary_fixed.default.hex}}"

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "{{colors.on_surface_variant.default.hex}}"
danger = "{{colors.error.default.hex}}"
success = "{{colors.secondary.default.hex}}"
placeholder = "{{colors.outline.default.hex}}"
selection = { background = "colors.core.accent", foreground = "colors.core.accent_foreground" }

[colors.text.links]
default = "{{colors.primary.default.hex}}"
visited = "{{colors.tertiary.default.hex}}"

[colors.input]
border = "colors.core.border"
border_focus = "colors.core.accent"
border_error = "{{colors.error.default.hex}}"

[colors.button.primary]
background = "{{colors.surface_container_high.default.hex}}"
foreground = "colors.core.foreground"
hover = { background = "{{colors.surface_container_highest.default.hex}}" }
focus = { outline = "colors.core.accent" }

[colors.list.item.hover]
foreground = "colors.core.foreground"
secondary_foreground = "colors.core.foreground"

[colors.list.item.selection]
background = "{{colors.surface_container_high.default.hex}}"
foreground = "colors.core.foreground"
secondary_background = "{{colors.surface_container_high.default.hex}}"
secondary_foreground = "colors.core.foreground"

[colors.grid.item]
background = "colors.core.secondary_background"
hover = { outline = "colors.core.foreground" }
selection = { outline = "colors.core.accent" }

[colors.scrollbars]
background = "colors.core.border"

[colors.loading]
bar = "colors.core.accent"
spinner = "colors.core.foreground"
