modules:
  http_reachable:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
        - 201
        - 204
        - 301
        - 302
        - 303
        - 307
        - 308
        - 401
        - 403
        - 404
