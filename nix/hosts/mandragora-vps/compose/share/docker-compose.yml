services:

  share:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${SHARE_IMAGE:-mandragora/share:local}
    container_name: share
    restart: unless-stopped
    environment:
      - SHARE_DATA_DIR=/data
      - SHARE_PUBLIC_BASE=https://share.${MVR_AC:-mvr.ac}
      - SHARE_INBOX_URL=${SHARE_INBOX_URL:-http://100.115.80.79:6688/api/inbox}
      - SHARE_MAX_MB=${SHARE_MAX_MB:-2048}
    volumes:
      - ${SHARE_DATA_VOLUME:-./data}:/data
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    networks:
      - seafile-net
      - tailnet-fwd
    labels:
      caddy_0: https://share.${MVR_AC:-mvr.ac}
      caddy_0.@private.path: "/inbox /inbox/* /drop /drop/* /api/drop"
      caddy_0.0_handle: "@private"
      caddy_0.0_handle.forward_auth: "authelia:9091"
      caddy_0.0_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy_0.0_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy_0.0_handle.reverse_proxy: "{{upstreams 8080}}"
      caddy_0.1_handle.reverse_proxy: "{{upstreams 8080}}"
      caddy_0.1_handle.request_body.max_size: "${SHARE_MAX_BODY:-2048MB}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    external: true
  tailnet-fwd:
    external: true
