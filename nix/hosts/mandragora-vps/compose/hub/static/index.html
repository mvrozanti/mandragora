<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13140d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>hub · mvr.ac</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="hub.css">
<script src="theme.js"></script>
</head>
<body>
<div class="hub">

  <header class="mv-topbar">
    <span class="mv-topbar__name">hub</span>
    <span class="mv-topbar__count" id="count">loading</span>
    <span class="mv-topbar__user">
      <span id="who">m</span>
      <a href="https://auth.mvr.ac/">settings</a>
      <a href="https://auth.mvr.ac/logout">sign out</a>
    </span>
  </header>

  <details class="mv-status hub__status" id="status">
    <summary class="mv-status__summary">
      <span class="mv-glance" id="glance">reading hosts</span>
    </summary>
    <div class="mv-status__body" id="statusBody"></div>
  </details>

  <div class="hub__controls">
    <input class="mv-search" id="q" type="search" placeholder="filter by name, host or machine"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="filter services">
    <div class="mv-chips" id="chips" role="group" aria-label="filter by group"></div>
  </div>

  <div class="mv-legend hub__legend" id="legend"></div>

  <main id="list"></main>

  <footer class="mv-footer">
    <span>mvr.ac · hub</span>
    <span>press / to filter</span>
    <span><a href="https://mvr.ac">root</a> · <a href="https://github.com/mvrozanti">github</a></span>
  </footer>

</div>
<script src="hub.js"></script>
</body>
</html>
