services:

  # Reverse-proxy-only stack. files.mvr.ac is served by filebrowser running on
  # mandragora-desktop (100.115.80.79:8096, opened on tailscale0 only), reached
  # over the tailnet. filebrowser runs auth.method=noauth + read-only perms, so
  # the app itself is ungated — caddy is the gate, split by path:
  #   - handle 0 (@public): /share/*, /api/public/*, /static/* -> ungated. These
  #     are the public share view (SPA shell), the share download/metadata API,
  #     and static assets. A share link exposes ONLY the shared path.
  #   - handle 1 (catch-all): browse UI, /api/resources, /api/raw, settings ->
  #     authelia two_factor. Never expose the browse side unauthenticated: root
  #     is / on the desktop, so the gate is the only thing between the internet
  #     and the whole disk.
  filebrowser-proxy:
    image: alpine:3.20
    container_name: filebrowser-proxy
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - seafile-net
    labels:
      caddy: https://files.${MVR_AC:-mvr.ac}
      caddy.@public.path: "/share/* /api/public/* /static/*"
      caddy.0_handle: "@public"
      caddy.0_handle.reverse_proxy: "${FILEBROWSER_UPSTREAM:-100.115.80.79:8096}"
      caddy.0_handle.reverse_proxy.flush_interval: "-1"
      caddy.0_handle.reverse_proxy.transport: "http"
      caddy.1_handle.forward_auth: "authelia:9091"
      caddy.1_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.1_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.1_handle.reverse_proxy: "${FILEBROWSER_UPSTREAM:-100.115.80.79:8096}"
      caddy.1_handle.reverse_proxy.flush_interval: "-1"
      caddy.1_handle.reverse_proxy.transport: "http"

networks:
  seafile-net:
    external: true
