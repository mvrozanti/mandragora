services:

  music:
    image: ${MUSIC_IMAGE:-nginx:stable-alpine}
    container_name: music
    restart: unless-stopped
    volumes:
      - ${MUSIC_STATIC_VOLUME:-./static}:/usr/share/nginx/html:ro
    networks:
      - seafile-net
    labels:
      caddy: https://music.${MVR_AC:-mvr.ac}
      caddy.header.Strict-Transport-Security: max-age=31536000;includeSubDomains
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.X-Frame-Options: SAMEORIGIN
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy.header.Permissions-Policy: geolocation=(),microphone=(),camera=()
      caddy.header.-Server: ""
      caddy.encode: zstd gzip
      caddy.redir: "/emotion /emotion/ 308"
      caddy.@gated.path: "${MUSIC_GATED_PATHS:-/audio/*}"
      caddy.0_handle_path: "/emotion/*"
      caddy.0_handle_path.forward_auth: "authelia:9091"
      caddy.0_handle_path.forward_auth.uri: "/api/authz/forward-auth"
      caddy.0_handle_path.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.0_handle_path.reverse_proxy: "${MUSIC_UPSTREAM:-100.115.80.79:8094}"
      caddy.1_handle: "@gated"
      caddy.1_handle.forward_auth: "authelia:9091"
      caddy.1_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.1_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.1_handle.reverse_proxy: "{{upstreams 80}}"
      caddy.2_handle.reverse_proxy: "{{upstreams 80}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    external: true
