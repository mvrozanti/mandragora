server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /mvr/skin.css {
        alias /srv/skin/skin.css;
        default_type text/css;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://authelia:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;

        sub_filter_once on;
        sub_filter '<meta name="theme-color" content="#000000" />' '<meta name="theme-color" content="#13140d" />';
        sub_filter 'content="width=device-width, initial-scale=1"' 'content="width=device-width, initial-scale=1, viewport-fit=cover"';
        sub_filter '</head>' '<link rel="stylesheet" href="/mvr/skin.css" /></head>';
    }
}
