server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /mvr/theme.json {
        proxy_pass http://host.docker.internal:6684/api/theme?colors=1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @palette_offline;
        add_header Cache-Control "no-store";
    }

    location @palette_offline {
        return 204;
    }

    location /mvr/ {
        alias /srv/skin/;
        add_header Cache-Control "public, max-age=300";
        types {
            text/css css;
            application/javascript js;
        }
        default_type text/plain;
    }

    location / {
        proxy_pass http://authelia:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;

        sub_filter_once on;
        sub_filter '<meta name="theme-color" content="#000000" />' '<meta name="theme-color" content="#13140d" />';
        sub_filter 'content="width=device-width, initial-scale=1"' 'content="width=device-width, initial-scale=1, viewport-fit=cover"';
        sub_filter '</head>' '<link rel="stylesheet" href="/mvr/theme.css" /><link rel="stylesheet" href="/mvr/skin.css" /><script src="/mvr/theme.js" data-endpoint="/mvr/theme.json" data-poll="0"></script></head>';
    }
}
