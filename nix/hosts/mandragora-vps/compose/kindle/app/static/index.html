<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13140d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>kindle · mvr.ac</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/components.css">
<link rel="stylesheet" href="/static/kindle.css">
<script src="/static/theme.js" data-endpoint="https://hub.mvr.ac/api/theme" data-credentials="include"></script>
</head>
<body>
<div class="kx">

  <header class="mv-topbar">
    <span class="mv-topbar__name">kindle</span>
    <span class="mv-topbar__count" id="glance">connecting</span>
    <span class="mv-topbar__user">
      <a href="https://hub.mvr.ac">hub</a>
      <a href="https://auth.mvr.ac/logout">sign out</a>
    </span>
  </header>

  <div id="alerts"></div>

  <div class="kx-split">

    <section class="kx-screen" aria-label="the device screen">
      <div class="kx-panel">
        <img id="screen" alt="live e-ink screen" hidden>
        <div class="kx-panel__empty mv-empty" id="screenempty">no frame yet</div>
      </div>
      <div class="kx-screen__bar">
        <button class="wa-btn primary" data-act="refresh">refresh</button>
        <a class="wa-btn" id="save" download="kindle.png" href="#">save</a>
        <span class="mv-topbar__count" id="grabbed"></span>
      </div>
    </section>

    <section class="kx-side">

      <details class="mv-status" open>
        <summary class="mv-status__summary"><span class="mv-dot is-unknown" id="dot"></span> device</summary>
        <div class="mv-status__body">
          <div class="mv-glance" id="detail">reading…</div>
          <div class="mv-meter" id="batmeter" hidden>
            <span class="mv-meter__label">batt</span>
            <span class="mv-meter__track"><i class="mv-meter__fill" id="batfill"></i></span>
            <span class="mv-meter__value" id="batval"></span>
          </div>
          <div class="mv-meter" id="diskmeter" hidden>
            <span class="mv-meter__label">disk</span>
            <span class="mv-meter__track"><i class="mv-meter__fill" id="diskfill"></i></span>
            <span class="mv-meter__value" id="diskval"></span>
          </div>
        </div>
      </details>

      <div class="kx-card">
        <p class="mv-label">send a file</p>
        <div class="kx-drop" id="drop">
          <input type="file" id="files" multiple hidden>
          <span>drop files, or <button class="kx-link" data-act="browse">choose</button></span>
        </div>
        <div class="kx-lanes">
          <label><input type="radio" name="lane" value="direct" checked> direct <span class="mv-topbar__count">tailnet, now</span></label>
          <label><input type="radio" name="lane" value="email"> email <span class="mv-topbar__count">amazon relay</span></label>
        </div>
        <div class="wa-acts"><button class="wa-btn primary" data-act="send">send</button></div>
      </div>

      <div class="kx-card">
        <p class="mv-label">print to the screen</p>
        <div class="kx-row">
          <input class="mv-search" id="text" placeholder="a line of text" maxlength="120">
          <button class="wa-btn" data-act="print">print</button>
        </div>
      </div>

      <div class="kx-card">
        <p class="mv-label">scriptlets</p>
        <div id="scriptlets" class="kx-scripts"><span class="mv-empty">loading</span></div>
        <pre class="kx-out" id="out" hidden></pre>
      </div>

    </section>
  </div>

  <footer class="mv-footer">
    <span>kindle.mvr.ac</span>
    <span>the screen is the source of truth</span>
    <span><a href="https://hub.mvr.ac">hub</a></span>
  </footer>

</div>
<div class="wa-toast" id="toast" role="status" hidden></div>
<script src="/static/kindle.js"></script>
</body>
</html>
