services:

  status:
    image: ${STATUS_IMAGE:-nginx:stable-alpine}
    container_name: status
    restart: unless-stopped
    volumes:
      - ${STATUS_STATIC_VOLUME:-./static}:/usr/share/nginx/html:ro
      - ${STATUS_DATA_VOLUME:-./data}:/srv/data:ro
      - ${STATUS_NGINX_CONFIG:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - seafile-net
    labels:
      caddy_0: https://status.${MVR_AC:-mvr.ac}
      caddy_0.header.Strict-Transport-Security: max-age=31536000;includeSubDomains
      caddy_0.header.X-Content-Type-Options: nosniff
      caddy_0.header.X-Frame-Options: SAMEORIGIN
      caddy_0.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy_0.header.Permissions-Policy: geolocation=(),microphone=(),camera=()
      caddy_0.header.-Server: ""
      caddy_0.encode: zstd gzip
      caddy_0.0_@live: "path /api/status-probes /api/vps"
      caddy_0.1_handle: "@live"
      caddy_0.1_handle.reverse_proxy: "host-stats:8081"
      caddy_0.2_handle.reverse_proxy: "{{upstreams 80}}"
      caddy_1: https://status.${SEAFILE_SERVER_HOSTNAME:-mvrozanti.duckdns.org}
      caddy_1.redir: "https://status.${MVR_AC:-mvr.ac}{uri} 302"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  status-puller:
    image: ${STATUS_PULLER_IMAGE:-alpine:3.20}
    container_name: status-puller
    restart: unless-stopped
    command: ["sh", "/app/puller.sh"]
    volumes:
      - ./puller.sh:/app/puller.sh:ro
      - ${STATUS_DATA_VOLUME:-./data}:/data
    environment:
      SOURCE: "http://host.docker.internal:6684"
      INTERVAL: "60"
    networks:
      - tailnet-fwd
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  seafile-net:
    external: true
  tailnet-fwd:
    external: true
