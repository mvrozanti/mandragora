server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        return 404;
    }

    location /data/ {
        alias /srv/data/;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
