<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "mandragora vault graph",
  "url": "https://demo.mvr.ac/",
  "description": "Interactive force-directed graph viewer for an Obsidian-style markdown knowledge vault documenting the mandragora NixOS workstation.",
  "author": {
    "@type": "Person",
    "name": "mvrozanti",
    "url": "https://mvr.ac"
  },
  "inLanguage": "en"
}
</script>
<noscript>
  <section class="demo-noscript"><p>The vault graph needs JavaScript.</p></section>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="vendor/vault-graph/vault-graph.js?v=6ffa7ee1"></script>
<script>
const SATURATION = 78;
const RAINBOW_SPAN = 280;
const MODE_KEY = "demo-graph-color-mode";
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const TIMELINE_NOTE = "oldest subject to newest, one hue per note. Grey: no date found. Hover the bar to find a color.";
const accentTheme = () => {
  const m = /^#?([0-9a-f]{6})$/i.exec(getComputedStyle(document.documentElement).getPropertyValue("--mv-accent").trim());
  if (!m) return { saturation: SATURATION, lightness: 60 };
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
  const h = !d ? 0 : (max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  return { hueOffset: h, saturation: SATURATION, lightness: Math.min(64, Math.max(56, l * 100)) };
};
const rainbow = (t, lightness) => `hsl(${(t * RAINBOW_SPAN).toFixed(1)} ${SATURATION}% ${lightness}%)`;
const readMode = () => { try { return localStorage.getItem(MODE_KEY) === "creation" ? "creation" : "category"; } catch { return "category"; } };
const saveMode = (mode) => { try { localStorage.setItem(MODE_KEY, mode); } catch {} };
let graphData = null;
let colorPanel = null;
let timeline = null;
let spectrum = [];

const buildColorPanel = (hud) => {
  colorPanel = document.createElement("div");
  colorPanel.className = "demo-color";
  colorPanel.setAttribute("role", "group");
  colorPanel.setAttribute("aria-label", "Color nodes by");
  colorPanel.innerHTML =
    '<span class="demo-color__label">color by</span>' +
    '<div class="mv-chips">' +
    '<button class="mv-chip" type="button" data-mode="category" aria-pressed="true">category</button>' +
    '<button class="mv-chip" type="button" data-mode="creation" aria-pressed="false">creation</button>' +
    '</div>';
  hud.insertBefore(colorPanel, hud.querySelector("#hud-categories"));
  timeline = document.createElement("div");
  timeline.className = "demo-timeline";
  timeline.hidden = true;
  timeline.innerHTML =
    '<div class="demo-timeline__bar"><div class="demo-timeline__cursor" hidden></div></div>' +
    '<div class="demo-timeline__ticks"></div><p class="demo-timeline__note" aria-live="polite"></p>';
  timeline.querySelector(".demo-timeline__note").textContent = TIMELINE_NOTE;
  hud.appendChild(timeline);
};

const renderTimeline = (lightness) => {
  const stops = Array.from({ length: 8 }, (_, i) => rainbow(i / 7, lightness)).join(", ");
  timeline.querySelector(".demo-timeline__bar").style.background = `linear-gradient(to right, ${stops})`;
  const dated = graphData.nodes.filter(n => typeof n.order === "number").sort((a, b) => a.order - b.order);
  spectrum = dated.map(n => ({ at: n.order, id: n.id, since: n.since }));
  if (!dated.length) return;
  const finalYear = dated[dated.length - 1].since.slice(0, 4);
  const years = [];
  const quarters = [];
  let month = null;
  for (const n of dated) {
    const year = n.since.slice(0, 4);
    if (!years.length || years[years.length - 1].label !== year) years.push({ label: year, at: n.order });
    if (year !== finalYear) continue;
    const mm = parseInt(n.since.slice(5, 7), 10) - 1;
    if (mm !== month && mm % 3 === 0) quarters.push({ label: MONTHS[mm], at: n.order });
    month = mm;
  }
  const finalStart = years[years.length - 1];
  const ranked = [years[0], finalStart, ...quarters, ...years.slice(1, -1)];
  const shown = [];
  for (const m of ranked) {
    if (m && !shown.includes(m) && shown.every(s => Math.abs(s.at - m.at) >= 0.16)) shown.push(m);
  }
  shown.sort((a, b) => a.at - b.at);
  const ticks = timeline.querySelector(".demo-timeline__ticks");
  ticks.replaceChildren(...shown.map(m => {
    const s = document.createElement("span");
    s.textContent = m.label;
    s.style.left = `${(m.at * 100).toFixed(1)}%`;
    if (m.at > 0.9) s.style.transform = "translateX(-100%)";
    else if (m.at < 0.05) s.style.transform = "none";
    return s;
  }));
};

const creationColors = (lightness) => {
  const grey = getComputedStyle(document.documentElement).getPropertyValue("--mv-text-ghost").trim();
  const byId = new Map();
  for (const n of graphData.nodes) byId.set(n.id, typeof n.order === "number" ? rainbow(n.order, lightness) : grey);
  return (n) => byId.get(n.id);
};

VaultGraph.create({
  brand: { title: "vault" },
  layoutCacheKey: "fake-obsidian-layout-v1",
  theme: accentTheme(),
  hudExtras: buildColorPanel,
  fetchGraph: () => fetch("graph.json").then(r => r.json()).then(g => (graphData = g)),
  fetchNote:  (path) => fetch("vault/" + path.split("/").map(encodeURIComponent).join("/")).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }),
}).then((vg) => {
  const hasDates = graphData.nodes.some(n => typeof n.order === "number");
  const chips = [...colorPanel.querySelectorAll(".mv-chip")];
  let mode = hasDates ? readMode() : "category";
  if (!hasDates) {
    const creation = colorPanel.querySelector('[data-mode="creation"]');
    creation.disabled = true;
    creation.title = "this graph was built without subject dates";
  }
  const bar = timeline.querySelector(".demo-timeline__bar");
  const cursor = timeline.querySelector(".demo-timeline__cursor");
  const note = timeline.querySelector(".demo-timeline__note");
  const monthOf = (d) => `${MONTHS[parseInt(d.slice(5, 7), 10) - 1]} ${d.slice(0, 4)}`;
  const firstAtOrAfter = (x) => {
    let lo = 0, hi = spectrum.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (spectrum[mid].at < x) lo = mid + 1; else hi = mid; }
    return lo;
  };
  const scrub = (e) => {
    if (mode !== "creation" || !spectrum.length) return;
    const r = bar.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const band = 6 / r.width;
    const hits = [];
    for (let i = firstAtOrAfter(f - band); i < spectrum.length && spectrum[i].at <= f + band; i++) hits.push(spectrum[i]);
    cursor.hidden = false;
    cursor.style.left = `${(f * 100).toFixed(2)}%`;
    if (!hits.length) {
      note.textContent = "no notes at this color";
    } else {
      const from = monthOf(hits[0].since), to = monthOf(hits[hits.length - 1].since);
      note.textContent = `${from === to ? from : `${from} – ${to}`} · ${hits.length} note${hits.length === 1 ? "" : "s"}`;
    }
    vg.setSpotlight(hits.map(h => h.id));
  };
  const endScrub = () => {
    cursor.hidden = true;
    note.textContent = TIMELINE_NOTE;
    vg.setSpotlight(null);
  };
  bar.addEventListener("pointermove", scrub);
  bar.addEventListener("pointerdown", (e) => { bar.setPointerCapture(e.pointerId); scrub(e); });
  bar.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") endScrub(); });
  bar.addEventListener("pointerleave", endScrub);
  bar.addEventListener("pointercancel", endScrub);
  const apply = () => {
    const lightness = accentTheme().lightness;
    endScrub();
    for (const c of chips) c.setAttribute("aria-pressed", String(c.dataset.mode === mode));
    document.body.classList.toggle("by-creation", mode === "creation");
    timeline.hidden = mode !== "creation";
    if (mode === "creation") renderTimeline(lightness);
    vg.setNodeColor(mode === "creation" ? creationColors(lightness) : null);
  };
  for (const c of chips) c.addEventListener("click", () => {
    if (c.disabled || c.dataset.mode === mode) return;
    mode = c.dataset.mode;
    saveMode(mode);
    apply();
  });
  apply();
  window.addEventListener("mv-theme", () => { vg.setTheme(accentTheme()); apply(); });
});
</script>
</body>
</html>
