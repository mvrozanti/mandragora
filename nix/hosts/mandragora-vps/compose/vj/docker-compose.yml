services:

  # Reverse-proxy-only stack. vj.mvr.ac is gated behind authelia and
  # forwarded over tailscale to the vj rater on mandragora-desktop
  # (100.115.80.79:8100): the Deck page, the sample API and the rendered
  # clips. The upstream renders on the desktop GPU under gpu-lock, so the
  # authelia gate is mandatory.
  vj-proxy:
    image: alpine:3.20
    container_name: vj-proxy
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - seafile-net
    labels:
      caddy: https://vj.${MVR_AC:-mvr.ac}
      caddy.0_handle.forward_auth: "authelia:9091"
      caddy.0_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.0_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.0_handle.reverse_proxy: "${VJ_UPSTREAM:-100.115.80.79:8100}"
      caddy.0_handle.reverse_proxy.flush_interval: "-1"
      caddy.0_handle.reverse_proxy.transport: "http"

networks:
  seafile-net:
    external: true
