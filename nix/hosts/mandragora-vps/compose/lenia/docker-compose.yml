services:

  lenia:
    image: ${LENIA_IMAGE:-nginx:stable-alpine}
    container_name: lenia
    restart: unless-stopped
    volumes:
      - ${LENIA_STATIC_VOLUME:-./static}:/usr/share/nginx/html:ro
      - ./mime.types:/etc/nginx/mime.types:ro
    networks:
      - seafile-net
    labels:
      caddy_0: https://lenia.${MVR_AC:-mvr.ac}
      caddy_0.header.Strict-Transport-Security: max-age=31536000;includeSubDomains
      caddy_0.header.X-Content-Type-Options: nosniff
      caddy_0.header.X-Frame-Options: SAMEORIGIN
      caddy_0.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy_0.header.Permissions-Policy: geolocation=(),microphone=(),camera=()
      caddy_0.header.-Server: ""
      caddy_0.encode: zstd gzip
      caddy_0.0_handle: "/mpd/*"
      caddy_0.0_handle.reverse_proxy: "${LENIA_BRIDGE_UPSTREAM:-100.115.80.79:8173}"
      caddy_0.0_handle.reverse_proxy.flush_interval: "-1"
      caddy_0.1_handle.reverse_proxy: "{{upstreams 80}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    external: true
