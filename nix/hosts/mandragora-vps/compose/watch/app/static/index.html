<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13140d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>watch · mvr.ac</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/components.css">
<link rel="stylesheet" href="/static/watch.css">
<script src="/static/theme.js" data-endpoint="https://hub.mvr.ac/api/theme" data-credentials="include"></script>
</head>
<body>
<div class="wa">

  <header class="mv-topbar">
    <span class="mv-topbar__name">watch</span>
    <span class="mv-topbar__count" id="count">loading</span>
    <span class="mv-topbar__user">
      <a href="https://hub.mvr.ac">hub</a>
      <a href="https://auth.mvr.ac/logout">sign out</a>
    </span>
  </header>

  <div class="wa-funnel" id="funnel"></div>
  <div class="wa-health" id="health"></div>

  <nav class="wa-tabs" id="tabs" role="tablist" aria-label="views">
    <button class="wa-tab" role="tab" data-v="inbox" aria-selected="true">inbox</button>
    <button class="wa-tab" role="tab" data-v="releases" aria-selected="false">releases</button>
    <button class="wa-tab" role="tab" data-v="watchers" aria-selected="false">watchers</button>
  </nav>

  <main id="view"><p class="mv-empty">loading</p></main>

  <footer class="mv-footer">
    <span>watch.mvr.ac</span>
    <span>polls, judges, and pushes only what passes</span>
    <span><a href="https://hub.mvr.ac">hub</a></span>
  </footer>

</div>
<div class="wa-toast" id="toast" role="status" hidden></div>
<script src="/static/watch.js"></script>
</body>
</html>
