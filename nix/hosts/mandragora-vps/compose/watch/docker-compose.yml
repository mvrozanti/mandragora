services:

  watch:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: ${WATCH_IMAGE:-mandragora/watch:local}
    container_name: watch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WATCH_DATA_DIR=/data
      - WATCH_JUDGE_ENABLED=0
      - WATCH_HEALTH_DIR=/health
      - WATCH_INBOX_URL=http://100.115.80.79:6688/api/inbox
    volumes:
      - ${WATCH_DATA_VOLUME:-./data}:/data
      - ./health:/health:ro
    networks:
      - seafile-net
    labels:
      caddy: https://watch.${MVR_AC:-mvr.ac}
      caddy.0_@internal: "path /internal/*"
      caddy.1_handle: "@internal"
      caddy.1_handle.0_@notTailnet: "not remote_ip 100.64.0.0/10"
      caddy.1_handle.1_handle: "@notTailnet"
      caddy.1_handle.1_handle.respond: "403"
      caddy.1_handle.2_handle.uri: "strip_prefix /internal"
      caddy.1_handle.2_handle.reverse_proxy: "{{upstreams 8080}}"
      caddy.2_handle.forward_auth: "authelia:9091"
      caddy.2_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.2_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.2_handle.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    external: true
