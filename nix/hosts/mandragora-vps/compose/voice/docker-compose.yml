services:

  voice:
    image: ${VOICE_IMAGE:-nginx:stable-alpine}
    container_name: voice
    restart: unless-stopped
    volumes:
      - ${VOICE_STATIC_VOLUME:-./static}:/usr/share/nginx/html:ro
    networks:
      - seafile-net
    labels:
      caddy: https://voice.${MVR_AC:-mvr.ac}
      caddy.header.Strict-Transport-Security: max-age=31536000;includeSubDomains
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy.header.Permissions-Policy: geolocation=(),microphone=(self),camera=()
      caddy.encode: zstd gzip
      caddy.@ws.path: "/ws*"
      caddy.@theme.path: "/api/theme /api/theme/*"
      caddy.0_handle: "@ws"
      caddy.0_handle.forward_auth: "authelia:9091"
      caddy.0_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.0_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.0_handle.reverse_proxy: "${VOICE_UPSTREAM:-100.115.80.79:8095}"
      caddy.0_handle.reverse_proxy.flush_interval: "-1"
      caddy.0_handle.reverse_proxy.transport: "http"
      caddy.1_handle: "@theme"
      caddy.1_handle.forward_auth: "authelia:9091"
      caddy.1_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.1_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.1_handle.reverse_proxy: "host.docker.internal:6684"
      caddy.1_handle.reverse_proxy.transport: "http"
      caddy.1_handle.reverse_proxy.transport.dial_timeout: "2s"
      caddy.2_handle.forward_auth: "authelia:9091"
      caddy.2_handle.forward_auth.uri: "/api/authz/forward-auth"
      caddy.2_handle.forward_auth.copy_headers: "Remote-User Remote-Groups Remote-Name Remote-Email"
      caddy.2_handle.reverse_proxy: "{{upstreams 80}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    external: true
