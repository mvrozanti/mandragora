description "mandragora — persistent services (dropbear, tailscaled)"

start on framework_ready
stop on stopping framework

export LANG LC_ALL

pre-start script
	[ -f "/etc/upstart/functions" ] && source /etc/upstart/functions
	f_log I mandragora start "" "spawning /mnt/us/mandragora/rc/start.sh in background"
	( setsid /bin/sh /mnt/us/mandragora/rc/start.sh >/dev/null 2>&1 & ) &
	return 0
end script
